[project]
name = "dacon-blackbox"
version = "0.1.0"
description = "DACON Blackbox Video Analysis Project"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.15.3",
    "scikit-learn==1.5.2",
    "opencv-python-headless==4.10.0.84",
    "pillow==10.4.0",
    "av>=15,<17",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "albumentations==1.4.20",
    "scikit-image==0.24.0",
    "timm==1.0.15",
    "fvcore==0.1.5.post20221221",
    "iopath==0.1.10",
    "yacs==0.1.8",
    "einops==0.8.1",
    "transformers==4.57.6",
    "accelerate==1.9.0",
    "huggingface-hub==0.34.4",
    "safetensors==0.6.2",
    "sentencepiece==0.2.0",
    "tokenizers>=0.22,<0.24",
    "regex==2024.9.11",
    "ultralytics==8.3.170",
    "lap==0.5.12",
    "filterpy==1.4.5",
    "shapely==2.0.6",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "tqdm==4.66.5",
    "loguru==0.7.2",
    "pyyaml==6.0.2",
    "rich==13.9.4",
    "psutil==6.1.1",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
    "torchmetrics>=1.4,<2",
    "nvidia-ml-py>=12,<14",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true